name: Android CI

on:
  push:
    branches:
      - Android
    tags:
      - "v*"
  pull_request:
    branches:
      - Android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare artifact version
        id: artifact_version
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: |
          test -n "$COPYMANGA_TAP_STRING" || { echo "Missing debug configuration" >&2; exit 1; }
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: CopyManga_Neo-${{ steps.artifact_version.outputs.short_sha }}-debug-apk
          path: |
            **/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/Android' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' \
              | sed '/^-----BEGIN .*SIGNATURE-----$/,$d' \
              > release_body.txt
          else
            git log -1 --pretty=%B > release_body.txt
          fi

          if [ ! -s release_body.txt ]; then
            git log -1 --pretty=%B > release_body.txt
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare artifact version
        id: artifact_version
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Write keystore properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
          ENABLE_ABI_SPLITS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          test -n "$COPYMANGA_TAP_STRING" || { echo "Missing release configuration" >&2; exit 1; }
          ./gradlew assembleRelease "-PenableAbiSplits=$ENABLE_ABI_SPLITS"

      - name: Generate APK checksums
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: app/build/outputs/apk/release
        run: sha256sum *.apk > SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: CopyManga_Neo-${{ steps.artifact_version.outputs.short_sha }}-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          # 0.10.25 先保留为尝鲜版草稿，核验签名和附件后再发布。
          name: ${{ github.ref_name == 'v0.10.25' && 'v0.10.25 尝鲜版 · 原生 Android' || github.ref_name }}
          draft: ${{ github.ref_name == 'v0.10.25' }}
          prerelease: ${{ github.ref_name == 'v0.10.25' }}
          make_latest: ${{ github.ref_name == 'v0.10.25' && 'false' || 'legacy' }}
          target_commitish: ${{ github.sha }}
          body_path: release_body.txt
          fail_on_unmatched_files: true
