name: Android CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: |
          test -n "$COPYMANGA_TAP_STRING" || { echo "Missing debug configuration" >&2; exit 1; }
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: |
            **/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release notes
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' \
              | sed '/^-----BEGIN .*SIGNATURE-----$/,$d' \
              > release_body.txt
          else
            git log -1 --pretty=%B > release_body.txt
          fi

          if [ ! -s release_body.txt ]; then
            git log -1 --pretty=%B > release_body.txt
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Write keystore properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: |
          test -n "$COPYMANGA_TAP_STRING" || { echo "Missing release configuration" >&2; exit 1; }
          ./gradlew assembleRelease

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: CopyManga_Neo-${{ github.ref_name }}-android-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Rename APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -path "*/release/*.apk" -type f | head -n 1)"
          test -n "$apk"
          cp "$apk" "CopyManga_Neo_${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: CopyManga_Neo_${{ github.ref_name }}.apk
          body_path: release_body.txt
          fail_on_unmatched_files: true
