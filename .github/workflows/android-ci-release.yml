name: Android CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            **/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release notes
        run: |
          set -euo pipefail
          git cat-file tag "refs/tags/${GITHUB_REF_NAME}" \
            | sed '1,/^$/d; /^-----BEGIN .*SIGNATURE-----$/,$d' \
            > release_body.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Write keystore properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyManga_Neo-${{ github.ref_name }}-android-release-apk
          path: |
            **/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: Rename APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -path "*/release/*.apk" -type f | head -n 1)"
          test -n "$apk"
          cp "$apk" "CopyManga_Neo_${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CopyManga_Neo_${{ github.ref_name }}.apk
          body_path: release_body.txt
          fail_on_unmatched_files: true
