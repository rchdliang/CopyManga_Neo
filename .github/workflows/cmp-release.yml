name: CMP builds and release draft
run-name: CMP ${{ github.event_name == 'push' && 'Android + Windows build' || 'Android + Windows + iOS release draft' }} (${{ github.sha }})

# 仅分支推送自动构建，不监听标签，避免同一提交的分支和标签各构建一次。
# 手动运行复用同一提交的成功自动构建，只创建草稿；草稿仍由维护者验收后公开。
on:
  push:
    branches: [CMP]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 不同提交各自构建；手动发布仍共用互斥组，避免同时修改草稿。
  group: cmp-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || 'release-draft' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.ref == 'refs/heads/CMP'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_build: ${{ steps.source.outputs.source_build }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      android_artifact_id: ${{ steps.source.outputs.android_artifact_id }}
      windows_artifact_id: ${{ steps.source.outputs.windows_artifact_id }}
      source_ios_build: ${{ steps.source.outputs.source_ios_build }}
      ios_run_id: ${{ steps.source.outputs.ios_run_id }}
      ios_artifact_id: ${{ steps.source.outputs.ios_artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check release automation
        run: node --test tests/ci/test_cmp_release.cjs
      - name: Validate version and destination
        id: source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/cmp-release.cjs').prepare({github, context, core});

  android:
    if: github.event_name == 'push'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          mapfile -t sdk_packages < <(python3 .github/scripts/android-sdk-packages.py)
          test "${#sdk_packages[@]}" -eq 4
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${sdk_packages[@]}"
      - name: Check signing and packaged configuration helpers
        run: |
          python3 -m unittest discover -s tests/ci -p 'test_android_signing.py'
          python3 -m unittest discover -s tests/ci -p 'test_app_config.py'
      - name: Restore existing release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare-test-signing.py
      - name: Build signed release APKs
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PenableAbiSplits=true -PrequireOfficialAppConfig=true \
            --no-daemon --no-configuration-cache --max-workers=1 --stacktrace
      - name: Verify release APK signatures and configuration
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: |
          python3 .github/scripts/verify-app-config.py android 'app/build/outputs/apk/release/*.apk'
          build_tools_version=$(python3 .github/scripts/android-sdk-packages.py --build-tools-version)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/$build_tools_version/apksigner" verify "$apk"
            test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable "$apk")" = false
          done
      - name: Remove ephemeral signing material
        if: ${{ always() }}
        run: |
          rm -f -- "$GITHUB_WORKSPACE/keystore.properties"
          rm -rf -- "$RUNNER_TEMP/android-test-signing"
      - name: Upload signed release APKs
        uses: actions/upload-artifact@v6
        with:
          name: cmp-release-android-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  windows:
    if: github.event_name == 'push'
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check Windows build tools
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 compiler missing' }
          "ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake missing' }
      - name: Check portable ZIP packaging
        run: python -m unittest discover -s tests/ci -p 'test_windows_portable.py'
      - name: Build Windows x64 installer and portable ZIP
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: |
          ./gradlew :desktopApp:packageInnoSetup :desktopApp:packageWindowsPortableZip -PenableAndroid=false -PdesktopRuntime=native \
            -PrequireOfficialAppConfig=true --no-daemon --no-configuration-cache --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8" --stacktrace
      - name: Verify Windows packaged configuration
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: python .github/scripts/verify-app-config.py desktop-native desktopApp/build/compose/binaries/main/graalvm-app/CopyMangaNeo
      - name: Upload Windows installer and portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: cmp-release-windows-${{ github.run_id }}
          path: |
            desktopApp/build/installer/CopyMangaNeo_windows_*_x64_setup.exe
            desktopApp/build/installer/CopyMangaNeo_windows_*_x64_setup.exe.sha256
            desktopApp/build/installer/CopyMangaNeo_windows_*_x64_portable.zip
            desktopApp/build/installer/CopyMangaNeo_windows_*_x64_portable.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  draft:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.android_artifact_id }}
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.windows_artifact_id }}
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.ios_artifact_id }}
          run-id: ${{ needs.prepare.outputs.ios_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: release-assets
      - name: Validate assets and create or resume draft
        uses: actions/github-script@v9
        env:
          CMP_SOURCE_BUILD: ${{ needs.prepare.outputs.source_build }}
          CMP_SOURCE_IOS_BUILD: ${{ needs.prepare.outputs.source_ios_build }}
        with:
          script: |
            await require('./.github/scripts/cmp-release.cjs').publish({
              github, context, core, sourceBuild: JSON.parse(process.env.CMP_SOURCE_BUILD),
              sourceIosBuild: JSON.parse(process.env.CMP_SOURCE_IOS_BUILD),
            });
