name: Multiplatform manual build
run-name: Manual multiplatform build (${{ github.ref_name }})

# Registration requires this file on the default branch; see docs/BUILDING.md.
# Deliberately no push, pull_request, tag or release trigger.
on:
  workflow_dispatch:
    inputs:
      android:
        description: Independently packaged Android test APK (stable signing) and unit tests
        type: boolean
        default: true
      windows:
        description: Windows x64 Nucleus + GraalVM installer and desktop tests
        type: boolean
        default: false
      linux:
        description: Linux x64 DEB/RPM and desktop tests
        type: boolean
        default: false
      wasm:
        description: Optimized Wasm browser distribution
        type: boolean
        default: false
      ios:
        description: iOS ARM64 device IPA (unsigned, for SideStore / AltStore)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-multiplatform-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  android:
    if: ${{ inputs.android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Show Java and Gradle versions
        run: ./gradlew --version
      - name: Install pinned Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Check test signing preparation
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Restore existing release signing for independent test APK
        # Same existing Secrets as android-ci-release.yml; never interpolate into shell.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare-test-signing.py
      - name: Build debug APK and run Android unit tests
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
          ORG_GRADLE_PROJECT_requireOfficialAppConfig: 'true'
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest -PuseReleaseSigningForTest=true --no-configuration-cache --no-daemon --stacktrace --max-workers=1 -Pkotlin.incremental=false
      - name: Verify Android packaged configuration
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: python3 .github/scripts/verify-app-config.py android 'app/build/outputs/apk/debug/*.apk'
      - name: Remove ephemeral signing material
        if: ${{ always() }}
        run: |
          rm -f -- "$GITHUB_WORKSPACE/keystore.properties"
          rm -rf -- "$RUNNER_TEMP/android-test-signing"
      - name: Upload android-debug-apk
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
      - name: Upload android-test-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/test-results/

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Show Java and Gradle versions
        run: ./gradlew --version
      - name: Check Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 compiler missing from runner' }
          "ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test desktop and build Windows Native Image installer
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
          ORG_GRADLE_PROJECT_requireOfficialAppConfig: 'true'
        run: ./gradlew :shared:desktopTest :desktopApp:test :desktopApp:packageInnoSetup -PenableAndroid=false -PdesktopRuntime=native --no-daemon --no-configuration-cache --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process "-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8"
      - name: Verify Windows packaged configuration
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: python .github/scripts/verify-app-config.py desktop-native desktopApp/build/compose/binaries/main/graalvm-app/CopyMangaNeo
      - name: Upload windows-x64-installers
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-installers-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktopApp/build/installer/*-windows-x64-setup.exe
            desktopApp/build/installer/*-windows-x64-setup.exe.sha256
      - name: Upload windows-test-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-reports-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/

  linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Show Java and Gradle versions
        run: ./gradlew --version
      - name: Install Linux packaging and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm fakeroot xvfb libgl1 libfontconfig1
      - name: Test desktop and build Linux installers
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
          ORG_GRADLE_PROJECT_requireOfficialAppConfig: 'true'
        run: xvfb-run --auto-servernum ./gradlew :shared:desktopTest :desktopApp:test :desktopApp:createDistributable :desktopApp:packageDeb :desktopApp:packageRpm -PenableAndroid=false --no-daemon --stacktrace --max-workers=1 -Pkotlin.incremental=false
      - name: Verify Linux packaged configuration
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: python3 .github/scripts/verify-app-config.py desktop desktopApp/build/compose/binaries/main/app
      - name: Upload linux-x64-installers
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-installers-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
      - name: Upload linux-test-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-test-reports-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/

  wasm:
    if: ${{ inputs.wasm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Show Java and Gradle versions
        run: ./gradlew --version
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install Yarn Classic and checksum-verified Binaryen 130
        run: |
          npm install --global yarn@1.22.22
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --location --retry 3 'https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz' --output "$archive"
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_130/bin" >> "$GITHUB_PATH"
          node --version
          yarn --version
          "$RUNNER_TEMP/binaryen-version_130/bin/wasm-opt" --version
      - name: Test browser host logic
        run: node --test tests/host/*.test.mjs
      - name: Build optimized Wasm production distribution
        # Keep development and production webpack in separate Gradle invocations.
        run: ./gradlew :shared:wasmJsBrowserDistribution -PenableAndroid=false --no-daemon --stacktrace --max-workers=1 -Pkotlin.incremental=false
      - name: Upload wasm-production
        uses: actions/upload-artifact@v6
        with:
          name: wasm-production-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            shared/build/dist/wasmJs/productionExecutable/

  ios:
    if: ${{ inputs.ios }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Also reaches the Gradle call made inside the Xcode shell build phase.
      ORG_GRADLE_PROJECT_enableAndroid: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Show Java and Gradle versions
        run: ./gradlew --version
      - name: Verify ARM64 runner and inspect Xcode project
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -list -project iosApp/iosApp.xcodeproj
      - name: Validate IPA packaging checks
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Build and validate unsigned device IPA
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
          ORG_GRADLE_PROJECT_requireOfficialAppConfig: 'true'
        run: bash .github/scripts/build-ios-ipa.sh
      - name: Verify iOS packaged configuration
        env:
          COPYMANGA_TAP_STRING: ${{ secrets.COPYMANGA_TAP_STRING }}
        run: python3 .github/scripts/verify-app-config.py ios 'build/*-ios-arm64-unsigned.ipa'
      - name: Upload ios-device-ipa
        uses: actions/upload-artifact@v6
        with:
          name: ios-device-ipa-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/*-ios-arm64-unsigned.ipa
            build/*-ios-arm64-unsigned.ipa.sha256
            build/ios-device-build.json
      - name: Upload ios-build-result
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-result-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ios-device-build.xcresult/
            build/ios-device/Build/Products/Release-iphoneos/*.dSYM/
